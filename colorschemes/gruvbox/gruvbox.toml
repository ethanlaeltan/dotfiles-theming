# Gruvbox (morhetz/gruvbox) -- warm, retro, low-contrast dark palette.
# Colors are the canonical Gruvbox "dark, medium contrast" palette:
#   bg0 background, bg1 surface, bg3 outline, fg1 text,
#   orange primary (the palette's signature accent), blue info,
#   bright red error, yellow warning
name = "Gruvbox"
primary = "#fe8019"
background = "#282828"
surface = "#3c3836"
outline = "#665c54"
text = "#ebdbb2"
error = "#cc241d"
warning = "#d79921"
info = "#458588"

# Papirus folder-icon color variant (`papirus-folders -l` for the full list)
folder_color = "orange"

# Wallpapers fetched from https://gruvbox-wallpapers.pages.dev/ (source:
# github.com/AngelJumbo/gruvbox-wallpapers) via `gruvbox-wallpaper`, which
# downloads into ./wallpapers/ and rewrites this line -- it never touches the
# live desktop itself, so switching the picture here around is free to do
# without committing to it; only `theme-apply gruvbox` (or the theme
# switcher) actually applies whichever one is set below.
wallpaper = "/home/ethan/.config/colorschemes/gruvbox/wallpapers/castleinskywindmill.png"
cmatrix_color = "yellow"

# Real 16-color ANSI terminal palette (kitty), the standard Gruvbox dark
# "hard contrast" mapping -- https://github.com/morhetz/gruvbox (blue slot is
# the palette's actual blue, unlike some retro themes that repurpose it).
[ansi]
color0  = "#282828"
color1  = "#cc241d"
color2  = "#98971a"
color3  = "#d79921"
color4  = "#458588"
color5  = "#b16286"
color6  = "#689d6a"
color7  = "#a89984"
color8  = "#928374"
color9  = "#fb4934"
color10 = "#b8bb26"
color11 = "#fabd2f"
color12 = "#83a598"
color13 = "#d3869b"
color14 = "#8ec07c"
color15 = "#ebdbb2"
