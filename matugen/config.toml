# Standalone matugen config for the theme-switcher widget.
# gtk3/gtk4/qt5ct/qt6ct/hyprland templates below are LOCAL COPIES of the ones
# DMS used to ship at /usr/share/quickshell/dms/matugen/templates/*. dms-shell
# 1.6.0 (2026-09-05) dropped those on-disk template files entirely -- theming
# is now rendered by an internal engine in the `dms` binary instead of by
# shelling out to the `matugen` CLI, so the old templates just vanished
# (matugen silently skips a template whose input_path is missing, which is
# why GTK/Qt/Hyprland colors stopped updating on theme-apply while the
# locally-authored templates like kitty/hyprtoolkit kept working fine).
# Pulled verbatim from the last dms-shell 1.5.3 package (still in
# /var/cache/pacman/pkg/) since they're plain matugen templates with no
# DMS-internal placeholders (no dank16 etc.) -- update these manually if a
# future DMS version changes its color-role mapping, since nothing will
# regenerate them automatically anymore.

[config]

[templates.gtk3]
input_path = '/home/ethan/.config/matugen/templates/gtk-colors.css'
output_path = '/home/ethan/.config/gtk-3.0/dank-colors.css'

[templates.gtk4]
input_path = '/home/ethan/.config/matugen/templates/gtk-colors.css'
output_path = '/home/ethan/.config/gtk-4.0/dank-colors.css'

[templates.gtk3-symbolic]
input_path = '/home/ethan/.config/matugen/templates/gtk-symbolic-colors.css'
output_path = '/home/ethan/.config/gtk-3.0/symbolic-colors.css'

[templates.gtk4-symbolic]
input_path = '/home/ethan/.config/matugen/templates/gtk-symbolic-colors.css'
output_path = '/home/ethan/.config/gtk-4.0/symbolic-colors.css'

[templates.qt5ct]
input_path = '/home/ethan/.config/matugen/templates/qtct-colors.conf'
output_path = '/home/ethan/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '/home/ethan/.config/matugen/templates/qtct-colors.conf'
output_path = '/home/ethan/.config/qt6ct/colors/matugen.conf'

[templates.hyprland]
input_path = '/home/ethan/.config/matugen/templates/hypr-colors.lua'
output_path = '/home/ethan/.config/hypr/dms/colors.lua'

[templates.hyprtoolkit]
input_path = '/home/ethan/.config/matugen/templates/hyprtoolkit-colors.conf'
output_path = '/home/ethan/.config/hypr/hyprtoolkit.conf'

# Our own template, not DMS's shared kitty-colors.conf -- that one needs a
# {{dank16.colorN.default.hex}} 16-color palette only DMS's own Go wrapper
# computes. This one is fed a real `ansi` 16-color table instead (see
# theme-apply and colorschemes/<name>/<name>.toml's optional [ansi] table).
[templates.kitty]
input_path = '/home/ethan/.config/matugen/templates/kitty-colors.conf'
output_path = '/home/ethan/.config/kitty/matugen-colors.conf'

[templates.starship]
input_path = '/home/ethan/.config/matugen/templates/starship.toml'
output_path = '/home/ethan/.config/starship.toml'

[templates.fastfetch]
input_path = '/home/ethan/.config/matugen/templates/fastfetch-config.jsonc'
output_path = '/home/ethan/.config/fastfetch/config.jsonc'

# The pywalfox browser extension (Firefox + Thunderbird) reads this exact
# path -- DMS's own separate matugen run (runDmsMatugenTemplates) writes a
# similarly-named ~/.cache/wal/dank-pywalfox.json instead, which nothing
# actually reads. `pywalfox update` (run by theme-apply) pushes this live to
# already-open tabs/windows without needing a browser restart.
[templates.pywalfox]
input_path = '/home/ethan/.config/matugen/templates/pywalfox-colors.json'
output_path = '/home/ethan/.cache/wal/colors.json'

# DMS's own internal matugen run (runDmsMatugenTemplates/matugenTemplateNeovim,
# matugenTemplateDgop) is supposed to cover these two, but only fires
# inconsistently on `dms restart` -- both were found stuck on a previous
# theme's colors after a later theme-apply run never touched them. Rendering
# them ourselves here makes them as reliable as everything else.
[templates.nvim]
input_path = '/home/ethan/.config/matugen/templates/nvim-dms.lua'
output_path = '/home/ethan/.config/nvim/colors/dms.lua'

[templates.dgop]
input_path = '/home/ethan/.config/matugen/templates/dgop-colors.json'
output_path = '/home/ethan/.config/dgop/colors.json'

[templates.cmatrix]
input_path = '/home/ethan/.config/matugen/templates/cmatrix.fish'
output_path = '/home/ethan/.config/fish/functions/cmatrix.fish'
